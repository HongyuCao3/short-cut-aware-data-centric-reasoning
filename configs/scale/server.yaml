# Server profile: large-scale for GPU servers (H100, A100, etc.)
model:
  vocab_size: 35
  d_model: 512
  nhead: 8
  num_layers: 6
  d_ff: 2048
  max_seq_len: 24
  dropout: 0.0

training:
  batch_size: 128
  lr: 1.0e-3
  epochs: 50
  weight_decay: 1.0e-4

data:
  n_train: 10000
  n_val: 2000
  n_test: 3000
  shortcut_ratio: 0.70

scoring:
  score_max_samples: 10000
  score_batch_size: 64

baselines:
  df_warmup_epochs: 5
  df_confidence_threshold: 0.90
  jtt_warmup_epochs: 5
  jtt_upweight_factor: 3
  focal_gamma: 2.0
  gdro_eta: 0.01
  irm_lambda: 1.0
  irm_anneal_epochs: 5
  vrex_beta: 1.0
  fishr_lambda: 1.0
  fishr_ema_decay: 0.95
  lff_q: 0.7
  influence_warmup_epochs: 5
  influence_remove_ratio: 0.3
  meta_reweight_lr: 0.01
